openapi: 3.0.0
info:
  version: 0.0.33
  title: Max Bot API
  license:
    name: Apache 2.0
servers:
  - url: https://platform-api2.max.ru
security:
  - access_token: [ ]
paths:
  /me:
    get:
      tags:
        - bots
      summary: Получает информацию о боте
      operationId: getMyInfo
      description: >-
        Возвращает информацию о боте, от имени которого выполняется запрос
      responses:
        '200':
          description: Информация о боте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - bots
      summary: Редактирует информацию о боте
      operationId: editMyInfo
      description: >-
        Редактирует информацию о текущем боте. Позволяет обновить имя,
        описание, команды и аватар бота
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotPatch'
      responses:
        '200':
          description: Изменённая информация о боте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/commands:
    patch:
      tags:
        - bots
      summary: Редактирует команды бота
      operationId: editMyCommands
      description: >-
        Добавляет, изменяет или удаляет команды бота, отображаемые пользователю
        в качестве подсказок при вводе « `/` ». Чтобы удалить команды,
        передайте пустой массив `commands`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCommandsPatch'
      responses:
        '200':
          description: Информация о командах бота
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats:
    get:
      tags:
        - chats
      operationId: getChats
      description: >-
        Возвращает список групповых чатов и каналов, в которые добавлен бот,
        информацию о каждом чате и маркер для перехода к следующей странице
        списка
      summary: Получает список всех групповых чатов и каналов
      deprecated: true
      parameters:
        - description: Количество запрашиваемых чатов
          name: count
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - description: >-
            Указатель на следующую страницу данных. Для первой страницы
            передайте `null`
          name: marker
          in: query
          schema:
            $ref: '#/components/schemas/bigint'
      responses:
        '200':
          description: В ответе с пагинацией возвращаются чаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}:
    get:
      tags:
        - chats
      operationId: getChat
      description: Возвращает информацию о групповом чате или канале по его ID
      summary: Получает информацию о групповом чате или канале
      parameters:
        - name: chatId
          description: ID запрашиваемого группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Информация о групповом чате или канале
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - chats
      operationId: editChat
      description: >-
        Редактирует информацию о групповом чате или канале, включая название,
        описание, иконку и закреплённое сообщение или пост.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала
      summary: Редактирует информацию о групповом чате или канале
      parameters:
        - name: chatId
          description: ID чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPatch'
      responses:
        '200':
          description: Возвращается обновлённый объект чата или канала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - chats
      operationId: deleteChat
      description: Удаляет групповой чат для всех участников
      summary: Удаляет групповой чат
      deprecated: true
      parameters:
        - name: chatId
          description: ID чата
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}/actions:
    post:
      tags:
        - chats
      operationId: sendAction
      description: >-
        Отправляет в диалог или групповой чат такие действия бота, как например:
        «набор текста» или «отправка фото»
      summary: Отправляет действие бота в диалог или групповой чат
      parameters:
        - name: chatId
          description: ID диалога или группового чата
          required: true
          in: path
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}/pin:
    get:
      tags:
        - chats
      operationId: getPinnedMessage
      description: >-
        Возвращает закреплённое сообщение в групповом чате или пост в канале.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала
      summary: >-
          Получает закреплённое сообщение в групповом чате или пост в канале
      parameters:
        - name: chatId
          description: ID чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Закреплённое сообщение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPinnedMessageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - chats
      operationId: pinMessage
      description: >-
        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала
      summary: Закрепляет сообщение в групповом чате или пост в канале
      parameters:
        - name: chatId
          description: >-
            ID группового чата или канала, где нужно закрепить сообщение или
            пост
          required: true
          in: path
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinMessageBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - chats
      operationId: unpinMessage
      description: >-
        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала
      summary: Открепляет сообщение в групповом чате или пост в канале
      parameters:
        - name: chatId
          description: >-
            ID группового чата или канала, в котором нужно открепить сообщение
            или пост
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: >-
            Объект удалён или запрос завершился ошибкой (причина ошибки описана
            в `message`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}/members/me:
    get:
      tags:
        - chats
      operationId: getMembership
      summary: Получает информацию о членстве бота в групповом чате или канале
      description: >-
        Возвращает информацию о членстве бота в групповом чате или канале, общую
        информацию о нём, а также список доступных прав доступа
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Информация о членстве бота
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - chats
      operationId: leaveChat
      summary: Удаляет бота из группового чата или канала
      description: Удаляет бота из участников группового чата или канала
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: >-
            Объект удалён или запрос завершился ошибкой (причина ошибки описана
            в `message`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}/members/admins:
    get:
      tags:
        - chats
      operationId: getAdmins
      summary: Получает список администраторов группового чата или канала
      description: >-
        Возвращает список всех администраторов группового чата или канала
        (пользователей и ботов), их данные, а также права на управление каналом
        или групповым чатом для пользователей-администраторов.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Список администраторов в групповом чате или канале
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMembersList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - chats
      operationId: postAdmins
      description: >-
        Выдаёт пользователям и ботам, которые являются участниками чата или
        подписчиками канала, права администратора. Максимум 50 администраторов
        в чате.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала с правом `add_admins`.


        Права, которые можно назначить, зависят от того, где (канал или чат) и
        кому (пользователь или бот) выданы. Если вы хотите изменить назначенные
        права, вызовите повторно текущий метод с обновлённым списком прав.


        **Описание доступных прав администратора**:


        - `read_all_messages` — право читать все сообщения в групповом чате или
        посты в канале. Без этого права не получится управлять сообщениями:
        закреплять (`pin_message`), редактировать и удалять посты в каналах
        (`edit` и `delete`) и групповых чатах (`write`). Это право важно при
        назначении ботов: без него бот не будет получать события группового чата
        или канала. Управление `read_all_messages` в интерфейсе мессенджера
        доступно только для ботов в групповых чатах

        - `edit` — право редактировать посты и комментарии в каналах (для
        групповых чатов недоступно). Право можно назначить, только если уже
        есть право `read_all_messages` или вместе с ним. Ранее вместо `edit`
        в API использовалось `edit_message` — в ответе могут возвращаться оба
        значения, однако при назначении новых прав администраторов используйте
        `edit`. Управление `edit` также дублируется в интерфейсе мессенджера

        - `delete` — право удалять посты и комментарии в каналах (для групповых
        чатов недоступно). Право можно назначить, только если уже есть право
        `read_all_messages` или вместе с ним. Ранее вместо `delete` в API
        использовалось `delete_message` — в ответе могут возвращаться оба
        значения, однако при назначении новых прав администраторов используйте
        `delete`. Управление `delete` также дублируется в интерфейсе мессенджера

        - `write` — право редактировать и удалять сообщения в групповых чатах, а
        также писать посты и комментарии в каналах. Право можно назначить,
        только если уже есть право `read_all_messages` или вместе с ним. Ранее
        вместо `write` в API использовалось `post_edit_delete_message` — в
        ответе могут возвращаться оба значения, однако при назначении новых прав
        администраторам используйте `write`. Управление `write` также
        дублируется в интерфейсе мессенджера

        - `pin_message` — право закреплять сообщение. Право можно назначить,
        только если уже есть право `read_all_messages` или вместе с ним

        - `change_chat_info` — право изменять информацию о канале или групповом
        чате

        - `add_remove_members` — право добавлять и удалять участников группового
        чата или подписчиков канала. Для пользователей право доступно и в чатах,
        и в каналах, для ботов — только в чатах. Управление `add_remove_members`
        также дублируется в интерфейсе мессенджера

        - `add_admins` — право добавлять и удалять администраторов группового
        чата или канала. Управление `add_admins` дублируется в интерфейсе
        мессенджера

        - `edit_link` — право изменять ссылку на групповой чат (для каналов
        недоступно). Управление `edit_link` также дублируется в интерфейсе
        мессенджера

        - `can_call` — право звонить в групповом чате (для каналов недоступно).
        Право проставляется автоматически при назначении администратором.
        Управление `can_call` в интерфейсе мессенджера не дублируется

        - `view_stats` — право на просмотр статистики каналов (для групповых
        чатов недоступно). Назначается по умолчанию владельцам каналов. Для
        других пользователей-администраторов канала и ботов недоступно.
        Управление `view_stats` в интерфейсе мессенджера не дублируется

        - `delete_message` — право удалять посты (для групповых чатов
        недоступно). Устаревшее значение

        - `edit_message` — право редактировать посты в каналах (для групповых
        чатов недоступно). Устаревшее значение

        - `post_edit_delete_message` — право  редактировать и удалять сообщения
        в групповых чатах, а также писать посты в каналах. Устаревшее значение
      summary: Назначает администраторов группового чата или канала
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatAdminsList'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}/members/admins/{userId}:
    delete:
      tags:
        - chats
      operationId: deleteAdmins
      description: >-
        Лишает пользователя или бота прав администратора в групповом чате или
        канале. При этом из чата и канала они не исключаются.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала с правом `add_admins`
      summary: Отменяет права администратора в групповом чате или канале
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
        - name: userId
          description: >-
            Идентификатор пользователя или бота, которого надо лишить прав
            администратора
          required: true
          in: path
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: >-
            Права администратора отменены или запрос завершился ошибкой (причина
            ошибки описана в `message`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /chats/{chatId}/members:
    get:
      tags:
        - chats
      operationId: getMembers
      summary: Получает участников группового чата или канала
      description: >-
        Возвращает список участников группового чата или канала и их данные,
        а также права на управление каналом или групповым чатом для
        пользователей-администраторов.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
        - name: user_ids
          description: >-
            Список ID пользователей, чьё членство нужно получить. Когда этот
            аргумент передан, аргументы `count` и `marker` игнорируются
          required: false
          in: query
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: integer
              format: int64
          style: simple
        - name: marker
          description: Указатель на следующую страницу данных
          in: query
          schema:
            type: integer
            format: int64
        - name: count
          description: Количество участников, которых нужно вернуть в ответе
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: '20'
      responses:
        '200':
          description: >-
            Возвращает список участников и указатель на следующую страницу
            данных.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMembersList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - chats
      operationId: addMembers
      description: >-
        Добавляет участников в групповой чат.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата с правом `add_remove_members`.


        Добавить подписчиков в канал с помощью этого метода нельзя.


        С 9 сентября 2026 г. работа метода ограничена, а с 30 сентября 2026 г.
        он будет удалён. После этого API MAX не предоставляет готовой
        возможности для добавления участников в групповой чат
      summary: Добавляет участников в групповой чат
      deprecated: true
      parameters:
        - name: chatId
          description: ID группового чата
          required: true
          in: path
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdsList'
      responses:
        '200':
          description: Успешный или неуспешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyMembersResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - chats
      operationId: removeMember
      description: >-
        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого чата или канала с правом `add_remove_members`
      summary: Удаляет участника из группового чата или канала
      parameters:
        - name: chatId
          description: ID группового чата или канала
          required: true
          in: path
          schema:
            type: integer
            format: int64
        - name: user_id
          description: >-
            ID пользователя, которого нужно удалить из группового чата или
            канала
          required: true
          in: query
          schema:
            type: integer
            format: int64
        - name: block
          description: >-
            Если передать `true`, пользователь будет заблокирован в чате.
            Применяется только для чатов с публичной или приватной ссылкой.
            Игнорируется в остальных случаях
          required: false
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: >-
            Объект удалён или запрос завершился ошибкой (причина ошибки описана
            в `message`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscriptions:
    get:
      tags:
        - subscriptions
      operationId: getSubscriptions
      description: Возвращает список всех Webhook подписок данного бота
      summary: Получает Webhook подписки
      responses:
        '200':
          description: Список текущих подписок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - subscriptions
      operationId: subscribe
      description: >-
        Настраивает доставку событий бота через Webhook — основной
        механизм получения событий в продуктовых интеграциях.
        При активной подписке Long Polling не работает.


        После вызова метода события отправляются на указанный Webhook-endpoint в
        виде HTTPS POST-запросов с объектом `Update`.

        Для повышения безопасности **с 25 мая** прекращена поддержка получения
        событий по HTTP, а также самоподписных сертификатов
      summary: Подписывает на доставку событий бота через Webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - subscriptions
      operationId: unsubscribe
      description: >-
        Отписывает бота от получения новых событий через Webhook.


        После вызова этого метода бот перестаёт получать новые события через
        Webhook и становится доступна доставка уведомлений через Long Polling
        (метод с длительным опросом)
      summary: Отписывает от доставки событий бота через Webhook
      parameters:
        - name: url
          in: query
          description: URL, который нужно удалить из подписок на WebHook
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            Бот отписан от обновлений или запрос завершился ошибкой (причина
            ошибки описана в `message`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /uploads:
    post:
      tags:
        - upload
      operationId: getUploadUrl
      description: >-
        Возвращает URL для последующей загрузки медиафайла.


        Медиафайл может быть одного из типов:


        - `image` — изображения (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC)

        - `video` — видеофайлы (MP4, MOV, MKV, WEBM)

        - `audio` — аудиофайлы (MP3, WAV, M4A и другие)

        - `file` — файлы в распространённых форматах (например, TXT, DOC и
        другие)


        Ограничения при загрузке медиафайлов:


        - Максимальный размер одного медиафайла, который можно загрузить,
        зависит от его типа:

          - 50 МБ или не более 7680 × 7680 px — для изображений (должны
          выполняться оба критерия)

          - 250 МБ — для видео

          - 256 МБ или длительностью не более 60 мин — для аудио (должны
          выполняться оба критерия)

          - 4 ГБ — для остальных файлов

        - По URL-ссылке, которая вернётся в ответ на запрос, можно загрузить
        только один файл. Если вы хотите загрузить ещё файл, отправьте запрос
        повторно и используйте новую URL-ссылку
      summary: Получает URL для загрузки медиафайлов
      parameters:
        - description: Тип загружаемого файла
          name: type
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/UploadType'
      responses:
        '200':
          description: >-
            Возвращает URL для загрузки вложения и токен для загрузки медиафайла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /messages:
    get:
      tags:
        - messages
      operationId: getMessages
      description: >-
        Возвращает массив сообщений из чата или постов из канала. Для выполнения
        запроса нужно указать один из параметров — `chat_id` или `message_ids`:


        - `chat_id` — ID чата или канала для получения сообщений или постов.
        Сообщения и посты возвращаются в обратном порядке: последние будут
        первыми в массиве

        - `message_ids` — Список ID сообщений или постов (`mid`).
        Можно указать один идентификатор или несколько
      summary: Получает список сообщений или постов
      parameters:
        - description: >-
            ID чата или канала, чтобы получить из него сообщения или посты.
            Обязательный параметр, если не указан `message_ids`
          name: chat_id
          in: query
          schema:
            $ref: '#/components/schemas/bigint'
        - description: >-
            Список ID сообщений или постов, которые нужно получить (через
            запятую). Обязательный параметр, если не указан `chat_id`
          name: message_ids
          in: query
          style: simple
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/MessageId'
            format: string
        - name: from
          description: >-
            Время, до которого будут запрошены все сообщения или посты, начиная
            с первого опубликованного. Формат времени: Unix timestamp
            в миллисекундах
          in: query
          schema:
            $ref: '#/components/schemas/bigint'
        - name: to
          description: >-
            Время, начиная с которого будут запрошены все сообщения или посты, —
            вплоть до последнего опубликованного. Формат времени: Unix timestamp
            в миллисекундах
          in: query
          schema:
            $ref: '#/components/schemas/bigint'
        - name: count
          description: Максимальное количество сообщений или постов в ответе
          in: query
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Информация о сообщении или массиве сообщений из чата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Это исключение возникает, когда пользователь приостановил бота или у
            него нет доступа к чату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - messages
      operationId: sendMessage
      description: >-
        Отправляет сообщение в диалог, групповой чат или канал.
        Возвращает созданное сообщение.


        #### Ограничения


        Можно отправлять не более двух сообщений в секунду в один диалог,
        групповой чат или канал. При превышении этого лимита сообщения следует
        ставить в очередь или делать задержку перед отправкой
      summary: Отправляет сообщение в чат
      parameters:
        - name: user_id
          description: >-
            Если вы хотите отправить сообщение пользователю, укажите ID этого
            пользователя
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: chat_id
          description: >-
            Если сообщение отправляется в чат или канал, укажите ID этого чата
            или канала
          schema:
            type: integer
            format: int64
          in: query
          required: false
        - name: disable_link_preview
          description: >-
            Если `true`, сервер не будет генерировать превью для ссылок
            в тексте сообщения или поста. Параметр действует для этого
            сообщения, в том числе при его дальнейшем редактировании
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageBody'
      responses:
        '200':
          description: >-
            Информация о созданном сообщении или опубликованном посте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - messages
      operationId: editMessage
      description: >-
        Редактирует сообщения и посты, отправленные ботом.


        #### Ограничения


        - Есть особенности редактирования сообщений в диалогах с ботом,
          связанные со сроком давности:

          - сообщения с кнопками `inline_keyboard` редактируются независимо от
            срока давности

          - остальные сообщения редактируются, если они отправлены менее 7 суток
          назад

        - В групповых чатах и каналах любые сообщения редактируются независимо
          от срока давности

        - Можно редактировать не более двух сообщений в секунду в одном диалоге,
          групповом чате или канале. При превышении этого лимита сообщения
          следует ставить в очередь или делать задержку перед редактированием
      summary: Редактирует сообщение в чате
      parameters:
        - name: message_id
          description: ID редактируемого сообщения
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - messages
      operationId: deleteMessage
      summary: Удаляет сообщение в чате
      description: >-
        Удаляет сообщения, если бот является администратором и имеет право на
        удаление:

        - В канале — любые сообщения

        - В диалоге — только сообщения, отправленные самим ботом

        - В групповом чате — любые сообщения


        Можно удалять не более двух сообщений в секунду в одном диалоге,
        групповом чате или канале. При превышении этого лимита сообщения следует
        ставить в очередь или делать задержку перед удалением
      parameters:
        - name: message_id
          description: ID удаляемого сообщения
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: >-
            Объект удалён или запрос завершился ошибкой (причина ошибки описана
            в `message`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /messages/{messageId}:
    get:
      tags:
        - messages
      operationId: getMessageById
      description: Возвращает сообщение из чата или канала по его ID
      summary: Получает сообщение по ID
      parameters:
        - description: >-
            ID сообщения (`mid`), чтобы получить одно сообщение в чате
            или канале
          in: path
          name: messageId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: Информация о сообщении с ID, указанным в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            В случае, если сообщение не найдено или бот не имеет доступа к нему
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /messages/{messageId}/comments:
    get:
      tags:
        - comments
      operationId: getComments
      description: >-
        Возвращает комментарии к посту в канале. Можно указать промежуток
        времени, за который нужно получить комментарии, и/или их количество.


        Если указан `comment_ids`, возвращаются только запрошенные комментарии,
        а остальные параметры игнорируются.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого канала с правом `read_all_messages`
      summary: Получает комментарии к посту в канале
      parameters:
        - description: >-
            Идентификатор поста (`mid`), к которому относятся комментарии
          in: path
          name: messageId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
        - description: >-
            Список ID комментариев, которые нужно получить (через запятую).
            Если параметр указан, остальные параметры игнорируются
          name: comment_ids
          in: query
          style: form
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/MessageId'
        - name: before
          description: >-
            Время, до которого будут запрошены все комментарии с начала поста.
            Формат времени: Unix timestamp в миллисекундах
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: after
          description: >-
            Время, начиная с которого будут запрошены все комментарии до конца
            поста. Формат времени: Unix timestamp в миллисекундах
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: count
          description: Максимальное количество комментариев в ответе
          in: query
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Список запрошенных комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - comments
      operationId: sendComment
      description: >-
        Отправляет комментарий к посту в канале.


        Для этого в настройках канала должны быть включены комментарии, а бот,
        чей токен `access_token` используется для авторизации, должен быть
        администратором этого канала с правами `read_all_messages` и `write`
      summary: Отправляет комментарий к посту в канале
      parameters:
        - description: >-
            Идентификатор поста (`mid`), к которому относится комментарий
          in: path
          name: messageId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCommentBody'
      responses:
        '200':
          description: Информация о созданном комментарии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCommentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - comments
      operationId: editComment
      description: >-
        Редактирует комментарий бота к посту в канале.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        участником этого канала. Комментарии, опубликованные от имени канала,
        можно редактировать, только если боту назначено право администратора
        `edit`; без этого права бот может редактировать лишь свои комментарии.


        Если канал архивирован или в нём отключены комментарии, бот может
        редактировать старые комментарии
      summary: Редактирует комментарий к посту в канале
      parameters:
        - description: >-
            Идентификатор поста (`mid`), комментарий к которому нужно
            отредактировать
          in: path
          name: messageId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
        - name: comment_id
          description: Идентификатор редактируемого комментария
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCommentBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - comments
      operationId: deleteComment
      summary: Удаляет комментарий к посту в канале
      description: >-
        Удаляет комментарий пользователя или бота к посту в канале. Можно
        удалять как свои комментарии, так и чужие. Восстановить удалённый
        комментарий нельзя.


        Если канал архивирован или в нём отключены комментарии, старые
        комментарии по-прежнему можно удалять.


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого канала с правами `read_all_messages` и `delete`
      parameters:
        - description: >-
            Идентификатор поста (`mid`), комментарий к которому нужно удалить
          in: path
          name: messageId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
        - name: comment_id
          description: Идентификатор удаляемого комментария
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /messages/{messageId}/comments/{commentId}:
    get:
      tags:
        - comments
      operationId: getCommentById
      summary: Получает комментарий по ID
      description: >-
        Возвращает информацию о комментарии к посту в канале по его
        идентификатору (`mid`).


        Бот, чей токен `access_token` используется для авторизации, должен быть
        администратором этого канала с правом `read_all_messages`
      parameters:
        - description: >-
            Идентификатор поста (`mid`), к которому относится комментарий
          in: path
          name: messageId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
        - description: Идентификатор комментария (`mid`)
          in: path
          name: commentId
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: >-
            Информация о комментарии, идентификатор которого был передан
            в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Комментарий или пост не найдены, либо у бота нет к ним доступа.
            Проверьте, что бот назначен администратором канала с правом
            `read_all_messages`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /videos/{videoToken}:
    get:
      tags:
        - messages
      operationId: getVideoAttachmentDetails
      description: >-
        Возвращает подробную информацию о видео, прикреплённом к сообщению
        в чате или канале: URL-адреса воспроизведения и дополнительные
        метаданные
      summary: Получает информацию о видео, прикреплённом к сообщению
      parameters:
        - description: Токен видео-вложения
          in: path
          name: videoToken
          required: true
          schema:
            type: string
            minLength: 1
            pattern: '^[a-zA-Z0-9\+/_-]+={0-2}$'
      responses:
        '200':
          description: Подробная информация о прикреплённом видео
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAttachmentDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            В случае, если сообщение не найдено или бот не имеет доступа к нему
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /answers:
    post:
      tags:
        - messages
      operationId: answerOnCallback
      description: >-
        Отправляет ответ после того, как пользователь нажал на кнопку. Ответом
        является обновлённое сообщение.


        #### Ограничения


        Можно отправлять не более двух ответов в секунду в один диалог,
        групповой чат или канал. При превышении этого лимита сообщения следует
        ставить в очередь или делать задержку перед отправкой
      summary: Отправляет ответ на Callback
      parameters:
        - name: callback_id
          description: >-
            Идентификатор кнопки, на которую нажал пользователь. Бот получает
            идентификатор как часть `Update` с типом `message_callback`
          required: true
          in: query
          schema:
            type: string
            minLength: 1
            pattern: '^\s+$'
        - name: disable_link_preview
          description: >-
            Если `true`, сервер не будет генерировать превью для ссылок в тексте
            сообщения или поста
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackAnswer'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /updates:
    get:
      operationId: getUpdates
      tags:
        - subscriptions
      description: >-
        Выполняет долгий запрос (Long Polling). Каждое событие имеет свой
        номер последовательности. Свойство `marker` в ответе указывает на
        следующее ожидаемое событие.


        Если параметр `marker` **не передан**, бот получит все ранее
        не полученные событие.


        > Этот метод можно использовать для получения событий бота при
        разработке и тестировании, если ваш бот не подписан на доставку событий
        через Webhook. Для production-окружения рекомендуем использовать
        доставку событий через Webhook
      summary: Получает новые события
      parameters:
        - name: limit
          description: Максимальное количество событий для получения
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: timeout
          description: Тайм-аут в секундах для долгого опроса
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 90
            default: 30
        - name: marker
          description: >-
            Маркер для получения событий с конкретной позиции.
            Для получения всех ранее непрочитанных событий, передайте `null`
          in: query
          schema:
            type: integer
            format: int64
        - name: types
          description: >-
            Список типов событий, которые вы хотите получать. Полный список
            возможных событий смотрите в описании класса `Update`
          in: query
          example: types=message_created,message_callback
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
          style: simple
      responses:
        '200':
          description: >-
            Список обновлений событий с указателем на следующую страницу данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    access_token:
      type: apiKey
      name: access_token
      description: >-
        A token is given to you by [MasterBot](https://tt.me/MasterBot) after
        you have created a bot.

        In all subsequent requests to the Bot API, you **must** pass the
        received token as an `access_token` parameter to the HTTP request.



        If [Terms and Conditions of Max usage](https://team.max.ru/en/terms/)
        have been violated, the Max administration may withdraw tokens by
        aborting user sessions.

        If your token has been compromised, you can request a new one by sending
        a `/revoke` command to **[MasterBot](https://tt.me/MasterBot)**.
      in: query
  responses:
    SuccessResponse:
      description: Успешный или неуспешный результат
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleQueryResult'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        Ошибка авторизации. Токен `access_token` указан некорректно или
        недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Ошибка доступа. У вас нет прав на доступ к этому ресурсу
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAllowed:
      description: Метод не разрешен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    bigint:
      type: integer
      format: int64
    MessageId:
      description: >-
        Идентификатор сообщения, поста или комментария (`mid`)
      type: string
      minLength: 1
      pattern: 'mid\.[a-zA-Z0-9_\-]+'
    User:
      description: >-
        Объект содержит общую информацию о пользователе или боте без аватара.


        Варианты наследования:

        - `UserWithPhoto` — объект с общей информацией о пользователе или боте,
        дополнительно содержит URL аватара и описание

        - `BotInfo` — объект включает общую информацию о боте, URL аватара и
        описание. Дополнительно содержит список команд, поддерживаемых ботом.
        Возвращается только при вызове метода `getMyInfo()`

        - `ChatMember` — объект включает общую информацию о пользователе или
        боте, URL аватара и описание при его наличии. Дополнительно содержит
        данные для пользователей-участников чата. Возвращается только при вызове
        некоторых методов группы `/chats`, например `getMembers()`
      properties:
        user_id:
          description: Идентификатор пользователя или бота
          type: integer
          format: int64
        first_name:
          description: Отображаемое имя пользователя или бота
          type: string
          minLength: 1
        last_name:
          description: >-
            Отображаемая фамилия пользователя. Для ботов это поле не
            возвращается
          type: string
          minLength: 1
        username:
          description: >-
            Никнейм бота или уникальное публичное имя пользователя. В случае с
            пользователем может отсутствовать, если тот недоступен или имя не
            задано
          type: string
          minLength: 1
        is_bot:
          description: '`true`, если это бот'
          type: boolean
        last_activity_time:
          description: >-
            Время последней активности пользователя или бота в MAX (Unix
            timestamp в миллисекундах). Если пользователь отключил в настройках
            профиля мессенджера MAX возможность видеть, что он в сети онлайн,
            поле может не возвращаться
          type: integer
          format: int64
      required:
        - user_id
        - first_name
        - is_bot
    UserWithPhoto:
      description: >-
        Объект с общей информацией о пользователе или боте. Является наследником
        схемы `User` — дополнительно к ней содержит URL аватара и описание
      allOf:
        - $ref: '#/components/schemas/User'
        - properties:
            description:
              description: >-
                Описание пользователя или бота. В случае с пользователем может
                отсутствовать, если описание не заполнено
              minLength: 1
              maxLength: 16000
              type: string
            avatar_url:
              description: >-
                URL аватара пользователя или бота в уменьшенном размере
              type: string
              minLength: 1
            full_avatar_url:
              description: URL аватара пользователя или бота в полном размере
              type: string
              minLength: 1
    BotInfo:
      description: >-
        Объект включает общую информацию о боте, URL аватара и описание.
        Является наследником схемы `UserWithPhoto`. Дополнительно к ней содержит
        список команд, поддерживаемых ботом. Возвращается только при вызове
        метода `getMyInfo()`
      allOf:
        - $ref: '#/components/schemas/UserWithPhoto'
        - properties:
            commands:
              description: Команды, поддерживаемые ботом
              type: array
              items:
                $ref: '#/components/schemas/BotCommand'
              maxItems: 32
    BotPatch:
      properties:
        first_name:
          description: Отображаемое имя пользователя или название бота
          type: string
          maxLength: 59
          minLength: 1
        last_name:
          description: Отображаемое второе имя бота
          type: string
          maxLength: 64
          minLength: 1
        description:
          description: Описание бота
          type: string
          minLength: 1
          maxLength: 16000
        commands:
          description: >-
            Команды, поддерживаемые ботом. Чтобы удалить все команды, передайте
            пустой список
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          maxItems: 32
        photo:
          description: Запрос на установку фото бота
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
    BotCommand:
      description: Команды, поддерживаемые ботом
      properties:
        name:
          description: Название команды
          type: string
          maxLength: 64
          minLength: 1
        description:
          description: Описание команды
          type: string
          minLength: 1
          maxLength: 128
      required:
        - name
    BotCommandsPatch:
      description: Объект для обновления команд бота
      properties:
        commands:
          description: >-
            Список команд и их описаний, отображаемых пользователю в подсказках
            при вводе « `/` »
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          maxItems: 32
      required:
        - commands
    BotCommandsInfo:
      description: Информация о командах бота
      properties:
        commands:
          description: Команды, которые поддерживает бот
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          maxItems: 32
    Chat:
      description: >-
        Объект содержит общую информацию о групповом чате или канале: его тип,
        настройки отображения (название, аватар, описание, ссылка), публичную
        доступность, а также информацию об участниках (владельце, боте и других
        пользователях), времени их последней активности и событиях
      properties:
        chat_id:
          description: ID чата или канала
          type: integer
          format: int64
        type:
          description: Тип чата
          allOf:
            - $ref: '#/components/schemas/ChatType'
        status:
          description: Статус чата
          allOf:
            - $ref: '#/components/schemas/ChatStatus'
        title:
          description: >-
            Отображаемое название чата или канала. Может отсутствовать для
            диалогов
          type: string
          minLength: 1
        icon:
          description: Аватар группового чата или канала
          allOf:
            - $ref: '#/components/schemas/Image'
        last_event_time:
          description: >-
            Время последнего события в чате или канале (Unix timestamp
            в миллисекундах)
          type: integer
          format: int64
        participants_count:
          description: >-
            Количество участников чата или канала. Для диалогов всегда `2`
          type: integer
          format: int32
        owner_id:
          description: ID владельца чата или канала
          type: integer
          format: int64
        participants:
          description: >-
            Список участников в формате ключ-значение (`array<int, int>`),
            где ключ — идентификатор участника `user_id`, а значение — время
            его последней активности в чате или канале `last_event_time`
            (Unix timestamp в миллисекундах) или `0`.
            Может отсутствовать, если запрашивается список чатов
          type: object
          additionalProperties:
            type: integer
            format: int64
        is_public:
          description: >-
            Параметр показывает, доступен ли групповой чат или канал публично.
            Для диалогов и приватных каналов — всегда `false`
          type: boolean
        link:
          description: Ссылка на чат
          type: string
        description:
          description: Описание чата или канала
          type: string
          minLength: 1
        dialog_with_user:
          description: >-
            Данные о пользователе в диалоге (только для чатов типа `dialog`)
          allOf:
            - $ref: '#/components/schemas/UserWithPhoto'
        messages_count:
          description: >-
            Количество сообщений в групповом чате или постов в канале.
            Недоступно для диалогов
          type: integer
          format: int32
        chat_message_id:
          description: >-
            Идентификатор сообщения с кнопкой, через которую был инициирован чат
          allOf:
            - $ref: '#/components/schemas/MessageId'
        pinned_message:
          description: >-
            Закреплённое сообщение в чате (возвращается только при запросе
            конкретного чата или канала)
          allOf:
            - $ref: '#/components/schemas/Message'
      required:
        - chat_id
        - type
        - status
        - last_event_time
        - participants_count
        - is_public
    ChatType:
      description: |-
        Тип чата.

        Возможные значения:
        - `chat` — Групповой чат
        - `channel` — Канал
        - `dialog` — Диалог

        Для комментариев к постам в канале значение определяет, от чьего имени
        оставлен комментарий:
        - `channel` — от имени канала
        - `chat` — от имени пользователя или бота
      enum:
        - channel
        - chat
        - dialog
    ChatStatus:
      description: |-
        Статус чата.

        Возможные значения:
        - `active` — Бот является активным участником чата
        - `removed` — Бот был удалён из чата
        - `left` — Бот покинул чат
        - `closed` — Чат был закрыт
      enum:
        - active
        - removed
        - left
        - closed
    ChatList:
      properties:
        chats:
          description: Список запрашиваемых чатов
          type: array
          items:
            $ref: '#/components/schemas/Chat'
        marker:
          description: Указатель на следующую страницу запрашиваемых чатов
          type: integer
          format: int64
      required:
        - chats
    ChatPatch:
      properties:
        icon:
          description: >-
            Данные для прикрепления изображения в качестве аватара чата
            или канала
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          description: >-
            Новое описание чата или канала. Чтобы удалить описание, передайте
            пустую строку
          type: string
          minLength: 0
          maxLength: 16000
        pin:
          description: >-
            ID сообщения для закрепления в чате или канале. Чтобы удалить
            закреплённое сообщение, используйте метод `unpinMessage()`
          allOf:
            - $ref: '#/components/schemas/MessageId'
        notify:
          description: >-
            Если `true`, участники получат системное уведомление об изменении
          type: boolean
          default: true
    ChatMember:
      description: >-
        Объект включает общую информацию о пользователе или боте, URL аватара и
        описание (при наличии). Является наследником схемы `UserWithPhoto`.
        Дополнительно к ней содержит данные для пользователей-участников чата
        или канала. Возвращается только при вызове некоторых методов группы
        `/chats`, например `getMembers()`
      allOf:
        - $ref: '#/components/schemas/UserWithPhoto'
        - properties:
            last_access_time:
              description: >-
                Время последней активности пользователя в чате. Может быть
                устаревшим для суперчатов (равно времени вступления)
              type: integer
              format: int64
            is_owner:
              type: boolean
              description: >-
                Является ли пользователь владельцем группового чата или канала
            is_admin:
              type: boolean
              description: >-
                Является ли пользователь администратором группового чата или
                канала
            join_time:
              type: integer
              format: int64
              description: >-
                Дата присоединения к чату (Unix timestamp в миллисекундах)
            permissions:
              description: >-
                Перечень прав доступа пользователя или бота, если тот является
                администратором группового чата или канала. Для обычных
                участников чата или канала поле не возвращается
              type: array
              uniqueItems: true
              items:
                allOf:
                  - $ref: '#/components/schemas/ChatAdminPermission'
            alias:
              description: >-
                Описание роли, которое будет отображаться на клиентском
                устройстве в настройках чата или канала рядом с именем
                пользователя


                Если пользователь администратор или владелец и ему не
                установлено это название, то поле не передаётся, клиентское
                устройство на своей стороне подменит значение на
                соответствующее: "владелец" или "админ"
              type: string
          required:
            - last_access_time
            - is_owner
            - is_admin
            - join_time
    ChatAdmin:
      properties:
        user_id:
          description: >-
            Идентификатор пользователя-участника группового чата или канала,
            который назначается администратором
          type: integer
          format: int64
        permissions:
          description: >-
            Перечень прав доступа пользователя или бота, который назначается
            администратором группового чата или канала. Если право назначается
            действующему администратору, то его текущие права будут обновлены
            в соответствии с переданным списком
          type: array
          uniqueItems: true
          items:
            allOf:
              - $ref: '#/components/schemas/ChatAdminPermission'
        alias:
          description: >-
            Описание роли, которое будет отображаться на клиентском устройстве в
            настройках чата или канала рядом с именем пользователя.
            Если пользователь администратор или владелец и ему не установлено
            это название, то поле не передаётся, клиентское устройство на своей
            стороне подменит значение на соответствующее: "владелец" или "админ"
          type: string
      required:
        - user_id
        - permissions
    ChatAdminPermission:
      description: >-
        Права администратора группового чата или канала.


        **Описание доступных прав администратора**:


        - `read_all_messages` — право читать все сообщения в групповом чате или
        посты в канале. Без этого права не получится управлять сообщениями:
        закреплять (`pin_message`), редактировать и удалять посты в каналах
        (`edit` и `delete`) и групповых чатах (`write`). Это право важно при
        назначении ботов: без него бот не будет получать события группового чата
        или канала. Управление `read_all_messages` в интерфейсе мессенджера
        доступно только для ботов в групповых чатах

        - `edit` — право редактировать посты и комментарии в каналах (для
        групповых чатов недоступно). Право можно назначить, только если уже
        есть право `read_all_messages` или вместе с ним. Ранее вместо `edit`
        в API использовалось `edit_message` — в ответе могут возвращаться оба
        значения, однако при назначении новых прав администраторов используйте
        `edit`. Управление `edit` также дублируется в интерфейсе мессенджера

        - `delete` — право удалять посты и комментарии в каналах (для групповых
        чатов недоступно). Право можно назначить, только если уже есть право
        `read_all_messages` или вместе с ним. Ранее вместо `delete` в API
        использовалось `delete_message` — в ответе могут возвращаться оба
        значения, однако при назначении новых прав администраторов используйте
        `delete`. Управление `delete` также дублируется в интерфейсе мессенджера

        - `write` — право редактировать и удалять сообщения в групповых чатах, а
        также писать посты и комментарии в каналах. Право можно назначить,
        только если уже есть право `read_all_messages` или вместе с ним. Ранее
        вместо `write` в API использовалось `post_edit_delete_message` — в
        ответе могут возвращаться оба значения, однако при назначении новых прав
        администраторам используйте `write`. Управление `write` также
        дублируется в интерфейсе мессенджера

        - `pin_message` — право закреплять сообщение. Право можно назначить,
        только если уже есть право `read_all_messages` или вместе с ним

        - `change_chat_info` — право изменять информацию о канале или групповом
        чате

        - `add_remove_members` — право добавлять и удалять участников группового
        чата или подписчиков канала. Для пользователей право доступно и в чатах,
        и в каналах, для ботов — только в чатах. Управление `add_remove_members`
        также дублируется в интерфейсе мессенджера

        - `add_admins` — право добавлять и удалять администраторов группового
        чата или канала. Управление `add_admins` дублируется в интерфейсе
        мессенджера

        - `edit_link` — право изменять ссылку на групповой чат (для каналов
        недоступно). Управление `edit_link` также дублируется в интерфейсе
        мессенджера

        - `can_call` — право звонить в групповом чате (для каналов недоступно).
        Право проставляется автоматически при назначении администратором.
        Управление `can_call` в интерфейсе мессенджера не дублируется

        - `view_stats` — право на просмотр статистики каналов (для групповых
        чатов недоступно). Назначается по умолчанию владельцам каналов. Для
        других пользователей-администраторов канала и ботов недоступно.
        Управление `view_stats` в интерфейсе мессенджера не дублируется

        - `delete_message` — право удалять посты (для групповых чатов
        недоступно). Устаревшее значение

        - `edit_message` — право редактировать посты в каналах (для групповых
        чатов недоступно). Устаревшее значение

        - `post_edit_delete_message` — право  редактировать и удалять сообщения
        в групповых чатах, а также писать посты в каналах. Устаревшее значение
      type: string
      enum:
        - add_admins
        - add_remove_members
        - can_call
        - change_chat_info
        - delete
        - delete_message
        - edit
        - edit_link
        - edit_message
        - pin_message
        - post_edit_delete_message
        - read_all_messages
        - view_stats
        - write
    ChatMembersList:
      description: >-
        Список участников группового чата или канала и указатель на следующую
        страницу данных
      properties:
        members:
          description: >-
            Список участников группового чата или канала с общей информацией о
            них, а также временем последней активности и списком прав доступа
            для пользователей и ботов, которые являются администраторами
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
        marker:
          description: Указатель на следующую страницу данных
          type: integer
          format: int64
      required:
        - members
    ChatAdminsList:
      properties:
        admins:
          description: >-
            Список пользователей и ботов, которые получат права администратора
            группового чата или канала
          type: array
          items:
            $ref: '#/components/schemas/ChatAdmin'
      required:
        - admins
    Image:
      description: Общая схема, описывающая объект изображения
      properties:
        url:
          description: URL изображения
          type: string
          minLength: 1
      required:
        - url
    Subscription:
      description: Схема для описания подписки на WebHook
      properties:
        url:
          description: URL вебхука
          type: string
          minLength: 12
        time:
          description: >-
            Unix timestamp в миллисекундах, когда была создана подписка
          type: integer
          format: int64
        update_types:
          description: Типы событий, на которые подписан бот
          example: '["message_created", "bot_started"]'
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        version:
          description: Версия API
          type: string
          minLength: 5
          pattern: '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
      required:
        - url
        - time
    Recipient:
      description: >-
        Получатель сообщения. Может быть пользователем, чатом или каналом
      properties:
        chat_id:
          description: ID чата или канала
          type: integer
          format: int64
        chat_type:
          description: >-
            Тип чата. Для комментариев определяет, от чьего имени оставлен
            комментарий
          allOf:
            - $ref: '#/components/schemas/ChatType'
        user_id:
          description: >-
            ID получателя сообщения в диалоге (пользователя или бота). Если
            сообщение отправлено в групповой чат или канал, параметр отсутствует
          type: integer
          format: int64
        post_id:
          description: >-
            Идентификатор поста в канале, к которому оставлен комментарий.
            Возвращается только для комментариев
          allOf:
            - $ref: '#/components/schemas/MessageId'
      required:
        - chat_id
        - chat_type
    Message:
      description: >-
        Содержит общую информацию о сообщении в чате или посте в канале: данные
        об отправителе и получателе, время создания сообщения, содержимое (текст
        и вложения), контекст связи с другими сообщениями (ответ или пересылка),
        а также публичную ссылку и статистику для постов в каналах
      properties:
        sender:
          description: >-
            Отправитель сообщения: пользователь или бот. Объект отсутствует,
            если сообщение отправлено от имени канала
          allOf:
            - $ref: '#/components/schemas/User'
        recipient:
          description: >-
            Получатель сообщения: пользователь или бот (для диалога), чат
            или канал
          allOf:
            - $ref: '#/components/schemas/Recipient'
        timestamp:
          description: >-
            Время создания сообщения (Unix timestamp в миллисекундах)
          type: integer
          format: int64
        link:
          description: Пересланное или ответное сообщение
          allOf:
            - $ref: '#/components/schemas/LinkedMessage'
        body:
          description: Содержимое сообщения. Текст + вложения
          allOf:
            - $ref: '#/components/schemas/MessageBody'
        stat:
          description: >-
            Статистика просмотров постов и репостов — возвращается только
            для каналов
          allOf:
            - $ref: '#/components/schemas/MessageStat'
        url:
          description: >-
            Публичная ссылка на пост в канале. Отсутствует для диалогов и
            групповых чатов
          type: string
          minLength: 1
      required:
        - recipient
        - body
        - timestamp
    CommentMessage:
      description: >-
        Комментарий к посту в канале.


        В отличие от сообщения в чате или поста в канале не содержит вложений
        `attachments` и не поддерживает пересылку комментариев
        (`link.type = forward`)
      type: object
      properties:
        sender:
          description: >-
            Пользователь, отправивший комментарий. Может быть `null`,
            если комментарий опубликован от имени канала
          allOf:
            - $ref: '#/components/schemas/User'
        recipient:
          description: 'Получатель комментария: канал'
          allOf:
            - $ref: '#/components/schemas/Recipient'
        timestamp:
          description: >-
            Время создания комментария (Unix timestamp в миллисекундах)
          type: integer
          format: int64
        link:
          description: Комментарий, на который получен ответ
          allOf:
            - $ref: '#/components/schemas/CommentLinkedMessage'
        body:
          description: Информация о комментарии
          allOf:
            - $ref: '#/components/schemas/CommentMessageBody'
        url:
          description: Публичная ссылка на комментарий в канале
          type: string
          minLength: 1
      required:
        - recipient
        - body
        - timestamp
    MessageStat:
      description: >-
        Статистика сообщения. Возвращается только для постов в каналах
      properties:
        views:
          description: >-
            Количество пользователей, которые увидели пост или репост в канале.
            Просмотр засчитывается, когда пост или репост попадает в область
            видимости экрана. Если это репост, будет показано количество именно
            его просмотров
          type: integer
      required:
        - views
    MessageBody:
      description: Информация о сообщении
      type: object
      properties:
        mid:
          description: Уникальный ID сообщения
          allOf:
            - $ref: '#/components/schemas/MessageId'
        seq:
          description: ID расположения сообщения в чате по порядку
          type: integer
          format: int64
        text:
          description: Текст сообщения
          type: string
        attachments:
          description: >-
            Вложения сообщения. Могут быть одним из типов вложений, описанных
            в классе `Attachment`
          type: array
          required: false
          items:
            $ref: '#/components/schemas/Attachment'
        markup:
          description: >-
            Разметка текста сообщения. Подробнее — в разделе
            [Форматирование](https://dev.max.ru/docs-api#Форматирование%20текста%20в%20сообщениях)
          type: array
          items:
            $ref: '#/components/schemas/MarkupElement'
      required:
        - mid
        - seq
        - text
    CommentMessageBody:
      description: Информация о комментарии
      type: object
      properties:
        mid:
          description: Уникальный ID комментария
          allOf:
            - $ref: '#/components/schemas/MessageId'
        seq:
          description: Порядковый номер расположения комментария в посте
          type: integer
          format: int64
        text:
          description: Текст комментария
          type: string
          minLength: 1
        markup:
          description: Разметка текста комментария
          type: array
          items:
            $ref: '#/components/schemas/MarkupElement'
      required:
        - mid
        - seq
        - text
    MessageList:
      description: >-
        Массив сообщений. Маркер следующей страницы API не возвращает: для
        перебора сдвигайте границы промежутка времени `from` и `to`
      properties:
        messages:
          description: Массив сообщений
          type: array
          items:
            $ref: '#/components/schemas/Message'
      required:
        - messages
    CommentMessageList:
      description: Список комментариев к посту в канале
      type: object
      properties:
        messages:
          description: Список комментариев к посту в канале
          type: array
          items:
            $ref: '#/components/schemas/CommentMessage'
      required:
        - messages
    TextFormat:
      description: >-
        Формат текста сообщения.


        В тексте комментариев не поддерживаются гиперссылки и упоминание
        пользователей
      type: string
      enum:
        - markdown
        - html
    NewMessageBody:
      description: >-
        Объект используется при отправке нового сообщения в чат или канал,
        редактировании существующего сообщения или поста, а также
        при callback-отправке сообщения пользователю, нажавшему кнопку
        в чате или канале.


        Параметры объекта содержат текст и способ его форматирования, вложения,
        ссылку на связанное сообщение (ответ или пересылка) и настройку
        PUSH-уведомлений для участников чата
      properties:
        text:
          description: Текст сообщения
          type: string
          maxLength: 4000
        attachments:
          description: >-
            Вложения сообщения. Если поле не передано или равно `null`,
            изменений не произойдёт. Если массив пуст, все вложения будут
            удалены
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRequest'
        link:
          description: >-
            Ссылка на сообщение в чате или пост в канале. Ссылки на комментарии
            к постам в каналах не поддерживаются
          type: object
          allOf:
            - $ref: '#/components/schemas/NewMessageLink'
        notify:
          description: >-
            Если `false`, участники чата не получат push-уведомления. Для
            каналов запрос нужно отправлять с `notify = true` или без этого
            поля: каналы не подразумевают отправку постов без push-уведомлений
          type: boolean
          default: true
        format:
          description: >-
            Разметка текста сообщения. Подробнее — в разделе
            [Форматирование](https://dev.max.ru/docs-api#Форматирование%20текста%20в%20сообщениях)
          allOf:
            - $ref: '#/components/schemas/TextFormat'
    NewCommentBody:
      description: >-
        Тело нового комментария к посту в канале.


        В отличие от сообщений в чатах и постов в каналах (`NewMessageBody`),
        в комментариях не поддерживаются вложения `attachments` и пересылка
        сообщения (тип `forward`)
      properties:
        text:
          description: Текст комментария
          type: string
          minLength: 1
          maxLength: 4000
        link:
          description: Ссылка на комментарий
          type: object
          allOf:
            - $ref: '#/components/schemas/NewMessageLink'
        format:
          description: >-
            Если установлен, текст комментария будет форматирован данным способом
          allOf:
            - $ref: '#/components/schemas/TextFormat'
      required:
        - text
    NewMessageLink:
      properties:
        type:
          description: Тип ссылки сообщения
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
        mid:
          description: ID исходного сообщения
          allOf:
            - $ref: '#/components/schemas/MessageId'
      required:
        - type
        - mid
    LinkedMessage:
      properties:
        type:
          description: Тип связанного сообщения
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
        sender:
          description: Пользователь или бот, отправивший сообщение
          allOf:
            - $ref: '#/components/schemas/User'
        chat_id:
          description: >-
            Чат или канал, в котором опубликовано связанное сообщение:
            для `type = forward` — чат-источник, для `type = reply` совпадает
            с чатом сообщения. `0`, если у бота нет доступа к чату-источнику
          type: integer
          format: int64
        message:
          description: Информация о связанном сообщении
          allOf:
            - $ref: '#/components/schemas/MessageBody'
      required:
        - type
        - chat_id
        - message
    CommentLinkedMessage:
      description: Комментарий, на который получен ответ
      properties:
        type:
          description: Тип связанного сообщения
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
        sender:
          description: >-
            Пользователь или бот, отправивший комментарий. Объект отсутствует,
            если комментарий опубликован от имени канала
          allOf:
            - $ref: '#/components/schemas/User'
        chat_id:
          description: Канал, в котором оставлен комментарий
          type: integer
          format: int64
        message:
          description: Информация о комментарии
          allOf:
            - $ref: '#/components/schemas/CommentMessageBody'
      required:
        - type
        - chat_id
        - message
    SendMessageResult:
      description: Информация о созданном сообщении
      properties:
        message:
          $ref: '#/components/schemas/Message'
      required:
        - message
    SendCommentResult:
      description: Информация о созданном комментарии
      type: object
      properties:
        message:
          $ref: '#/components/schemas/CommentMessage'
      required:
        - message
    Attachment:
      description: |-
        Общая схема, представляющая вложение сообщения.

        Кроме текста сообщения и посты могут содержать следующие типы вложений:
        - `image` — изображение (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC)
        - `video` — видео (MP4, MOV, MKV, WEBM, MATROSKA)
        - `audio` — аудио (MP3, WAV, M4A и другие)
        - `file` — файл (TXT, DOC и другие)
        - `sticker` — стикер
        - `contact` — контакт (данные контакта из телефонного справочника)
        - `inline_keyboard` — сообщение или пост с кнопкой
        - `share` — контент, прикреплённый по внешнему URL
        - `location` — локация
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachment'
          video: '#/components/schemas/VideoAttachment'
          audio: '#/components/schemas/AudioAttachment'
          file: '#/components/schemas/FileAttachment'
          sticker: '#/components/schemas/StickerAttachment'
          contact: '#/components/schemas/ContactAttachment'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachment'
          share: '#/components/schemas/ShareAttachment'
          location: '#/components/schemas/LocationAttachment'
      properties:
        type:
          description: Тип вложения
          type: string
      required:
        - type
    PhotoAttachment:
      description: Вложение изображения
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              type: object
              allOf:
                - $ref: '#/components/schemas/PhotoAttachmentPayload'
          required:
            - payload
    PhotoAttachmentPayload:
      description: Данные, использованные для отправки изображения
      properties:
        photo_id:
          description: Уникальный ID этого изображения
          type: integer
          format: int64
        token:
          description: >-
            Токен вложения — уникальный ID загруженного медиа: изображения,
            аудио, видео или файла. Возвращается в ответ на вызов [POST
            /uploads](https://dev.max.ru/docs-api/methods/POST/uploads)
          type: string
          minLength: 1
        url:
          description: >-
            URL изображения. Время жизни ссылки ограниченно. Срок истечения
            указан в параметре `expires` — если он истёк, ссылку необходимо
            запросить повторно. Доступно в веб-клиенте и на Android
          type: string
          minLength: 1
      required:
        - photo_id
        - url
        - token
    VideoAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              type: object
              allOf:
                - $ref: '#/components/schemas/MediaAttachmentPayload'
            thumbnail:
              description: Миниатюра видео
              type: string
              allOf:
                - $ref: '#/components/schemas/VideoThumbnail'
            width:
              description: Ширина видео
              type: integer
            height:
              description: Высота видео
              type: integer
            duration:
              description: Длина видео в секундах
              type: integer
          required:
            - payload
    VideoThumbnail:
      properties:
        url:
          description: URL изображения
          type: string
          minLength: 1
      required:
        - url
    VideoUrls:
      properties:
        mp4_1080:
          description: URL видео в разрешении 1080p, если доступно
          type: string
          minLength: 1
        mp4_720:
          description: URL видео в разрешении 720p, если доступно
          type: string
          minLength: 1
        mp4_480:
          description: URL видео в разрешении 480p, если доступно
          type: string
          minLength: 1
        mp4_360:
          description: URL видео в разрешении 360p, если доступно
          type: string
          minLength: 1
        mp4_240:
          description: URL видео в разрешении 240p, если доступно
          type: string
          minLength: 1
        mp4_144:
          description: URL видео в разрешении 144p, если доступно
          type: string
          minLength: 1
        hls:
          description: URL трансляции, если доступна
          type: string
          minLength: 1
    VideoAttachmentDetails:
      properties:
        token:
          description: Токен видео-вложения
          type: string
          minLength: 1
        urls:
          description: >-
            URL-ы для скачивания или воспроизведения видео. Может отсутствовать,
            если видео недоступно
          allOf:
            - $ref: '#/components/schemas/VideoUrls'
        thumbnail:
          description: Миниатюра видео
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentPayload'
        width:
          description: Ширина видео
          type: integer
        height:
          description: Высота видео
          type: integer
        duration:
          description: Длина видео в секундах
          type: integer
      required:
        - width
        - height
        - duration
        - token
    AudioAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              type: object
              allOf:
                - $ref: '#/components/schemas/MediaAttachmentPayload'
            transcription:
              description: Аудио транскрипция
              type: string
          required:
            - payload
    FileAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              type: object
              allOf:
                - $ref: '#/components/schemas/FileAttachmentPayload'
            filename:
              description: Имя загруженного файла
              type: string
            size:
              description: Размер файла в байтах
              type: integer
              format: int64
          required:
            - payload
            - filename
            - size
    AttachmentPayload:
      properties:
        url:
          description: >-
            URL вложения, который возвращается в объекте `Update` после
            отправки сообщения в чат или канал.


            В случае с вложенным видео прямую ссылку также можно получить
            с помощью метода `getVideoAttachmentDetails()`
          type: string
          minLength: 1
      required:
        - url
    MediaAttachmentPayload:
      description: Результат загрузки аудио или видео
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
        - properties:
            id:
              type: integer
            token:
              description: >-
                Используйте `token`, если вы пытаетесь повторно использовать
                одно и то же вложение в другом сообщении.
          required:
            - id
            - token
    FileAttachmentPayload:
      description: Результат загрузки файла
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
        - properties:
            token:
              description: >-
                Используйте `token`, если вы пытаетесь повторно использовать
                одно и то же вложение в другом сообщении.
              type: string
              minLength: 1
          required:
            - token
    ContactAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              description: Результат загрузки данных контакта в сообщение
              type: object
              allOf:
                - $ref: '#/components/schemas/ContactAttachmentPayload'
          required:
            - payload
    ContactAttachmentPayload:
      properties:
        vcf_info:
          description: Информация о пользователе в формате VCF
          type: string
          minLength: 1
        hash:
          description: >-
            Хеш информации о пользователе в формате VCF. Используется для
            проверки того, что пользователь поделился номером телефона,
            привязанным к его аккаунту в МАКС
          type: string
          minLength: 1
        max_info:
          description: Информация о пользователе
          allOf:
            - $ref: '#/components/schemas/User'
    StickerAttachmentPayload:
      description: Результат загрузки стикера
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
        - properties:
            code:
              description: ID стикера
              type: string
              minLength: 1
          required:
            - code
    StickerAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              description: Данные, использованные для отправки стикера
              type: object
              allOf:
                - $ref: '#/components/schemas/StickerAttachmentPayload'
            width:
              description: Ширина стикера
              type: integer
            height:
              description: Высота стикера
              type: integer
          required:
            - payload
            - width
            - height
    ShareAttachmentPayload:
      description: Данные прикреплённого к сообщению предпросмотра медиавложения
      properties:
        url:
          description: >-
            URL, прикреплённый к сообщению для предпросмотра медиавложения
          type: string
          minLength: 1
        token:
          description: Токен вложения
          type: string
          minLength: 1
      required:
        - url
    ShareAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              description: >-
                Данные, использованные для прикрепления к сообщению
                предпросмотра контента по внешнему URL
              type: object
              allOf:
                - $ref: '#/components/schemas/ShareAttachmentPayload'
            title:
              description: Заголовок предпросмотра ссылки.
              type: string
              minLength: 1
            description:
              description: Описание предпросмотра ссылки
              type: string
              minLength: 1
            image_url:
              description: Изображение предпросмотра ссылки
              type: string
              minLength: 1
          required:
            - payload
    LocationAttachment:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            latitude:
              type: number
              format: double
              description: Широта, до 15 символов
            longitude:
              type: number
              format: double
              description: Долгота, до 15 символов
          required:
            - latitude
            - longitude
    InlineKeyboardAttachment:
      description: Кнопки в сообщении
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              description: >-
                Данные клавиатуры. Подробнее о типах кнопок и клавиатуре
                в ботах — в разделе [«Клавиатура для
                чат-бота»](https://dev.max.ru/docs-api#Клавиатура%20для%20чат-бота)
              type: object
              allOf:
                - $ref: '#/components/schemas/Keyboard'
          required:
            - payload
    Keyboard:
      description: Клавиатура — это двумерный массив кнопок
      properties:
        buttons:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/Button'
      required:
        - buttons
    Button:
      description: Базовый класс кнопки
      properties:
        type:
          description: Тип кнопки
          type: string
        text:
          description: >-
            Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не
            превышать заданное количество символов в зависимости от размещения
            текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при
            3, `3` — при 4
          type: string
          minLength: 1
          maxLength: 128
      discriminator:
        propertyName: type
        mapping:
          callback: '#/components/schemas/CallbackButton'
          link: '#/components/schemas/LinkButton'
          request_geo_location: '#/components/schemas/RequestGeoLocationButton'
          request_contact: '#/components/schemas/RequestContactButton'
          open_app: '#/components/schemas/OpenAppButton'
          message: '#/components/schemas/MessageButton'
          chat: '#/components/schemas/ChatButton'
          clipboard: '#/components/schemas/ClipboardButton'
      required:
        - type
        - text
    CallbackButton:
      description: >-
        Callback-кнопка.


        После нажатия на такую кнопку клиент отправляет на сервер полезную
        нагрузку, которая содержит
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            payload:
              description: Токен кнопки
              type: string
              minLength: 1
              maxLength: 1024
          required:
            - payload
    LinkButton:
      description: >-
        Кнопка-ссылка.


        После нажатия на такую кнопку пользователь переходит по ссылке, которую
        она содержит
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            url:
              description: URL кнопки
              type: string
              minLength: 4
              maxLength: 2048
          required:
            - url
    RequestContactButton:
      description: >-
        Кнопка запроса контакта.


        После нажатия на такую кнопку клиент отправляет новое сообщение
        с вложением текущего контакта пользователя
      allOf:
        - $ref: '#/components/schemas/Button'
    RequestGeoLocationButton:
      description: >-
        Кнопка запроса геолокации.


        После нажатия на такую кнопку клиент отправляет новое сообщение с
        вложением текущего географического положения пользователя
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            quick:
              description: >-
                Если `true`, отправляет местоположение без запроса
                подтверждения пользователя. Если `false`, возвращает модальное
                окно с дополнительным уточнением об отправке местоположения
              type: boolean
              default: false
    ChatButton:
      description: >-
        Кнопка создания чата.


        Кнопка, которая создает новый чат, как только первый пользователь на неё
        нажмёт.

        Бот будет добавлен в участники чата как администратор.

        Автор сообщения станет владельцем чата.
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            chat_title:
              description: Название чата, который будет создан
              type: string
              minLength: 1
              maxLength: 200
            chat_description:
              description: Описание чата
              type: string
              minLength: 1
              maxLength: 400
            start_payload:
              description: >-
                Стартовая полезная нагрузка будет отправлена боту, как только
                чат будет создан
              type: string
              minLength: 1
              maxLength: 512
            uuid:
              description: >-
                Уникальный ID кнопки среди всех кнопок чата на клавиатуре.

                Если `uuid` изменён, новый чат будет создан при следующем
                нажатии.

                Сервер сгенерирует его в момент, когда кнопка будет впервые
                размещена.

                Используйте его при редактировании сообщения.
              type: integer
          required:
            - chat_title
    OpenAppButton:
      description: Кнопка для запуска мини-приложения
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            web_app:
              description: >-
                Публичное имя (username) бота или ссылка на него, чьё
                мини-приложение надо запустить
              type: string
              minLength: 5
            contact_id:
              description: >-
                Идентификатор бота, чьё мини-приложение надо запустить
              type: integer
              format: int64
            payload:
              description: >-
                Параметр запуска, который будет передан в `initData`
                мини-приложения
              type: string
              minLength: 1
    ClipboardButton:
      description: >-
        Кнопка буфера обмена.


        При нажатии на кнопку с типом `clipboard` текст, указанный в свойстве
        `payload`, копируется в буфер обмена
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            payload:
              description: Текст, который будет скопирован
              type: string
              maxLength: 1024
          required:
            - payload
    MessageButton:
      description: >-
        Кнопка сообщения.


        Кнопка для отправки сообщения
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            text:
              minLength: 1
              maxLength: 128
              description: >-
                Текст кнопки, который будет отправлен в чат от лица пользователя
              type: string
    MessageLinkType:
      description: |-
        Тип связанного сообщения.

        Возможные значения:
        - `reply` — Ответ на сообщение или комментарий в чате или канале
        - `forward` — Пересланное сообщение в чате или канале

        Для комментариев поддерживается только тип `reply`
      type: string
      enum:
        - forward
        - reply
    AttachmentRequest:
      description: Запрос на прикрепление данных к сообщению
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachmentRequest'
          video: '#/components/schemas/VideoAttachmentRequest'
          audio: '#/components/schemas/AudioAttachmentRequest'
          file: '#/components/schemas/FileAttachmentRequest'
          sticker: '#/components/schemas/StickerAttachmentRequest'
          contact: '#/components/schemas/ContactAttachmentRequest'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachmentRequest'
          location: '#/components/schemas/LocationAttachmentRequest'
          share: '#/components/schemas/ShareAttachmentRequest'
      properties:
        type:
          type: string
      required:
        - type
    PhotoAttachmentRequest:
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
          required:
            - payload
    PhotoAttachmentRequestPayload:
      description: >-
        Данные для прикрепления изображения (все поля являются
        взаимоисключающими).


        Вместе с изображениями можно прикрепить видеофайлы (`type: video`)
        и одно вложение с кнопками (`type: inline_keyboard`). Общее количество
        вложений не должно превышать 12. Подробнее — [в
        примерах](https://dev.max.ru/docs-api#Примеры%20с%20видео,%20изображением,%20файлом)
      properties:
        url:
          description: >-
            Любой внешний URL изображения, которое вы хотите прикрепить
          minLength: 1
          type: string
        token:
          description: Токен существующего вложения
          type: string
          minLength: 1
    PhotoToken:
      properties:
        token:
          description: Закодированная информация загруженного изображения
          type: string
          minLength: 1
      required:
        - token
    PhotoTokens:
      description: >-
        Это информация, которую вы получите, как только изображение будет
        загружено
      properties:
        photos:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PhotoToken'
      required:
        - photos
    VideoAttachmentRequest:
      description: >-
        Данные для прикрепления видео к сообщению.


        Вместе с видео можно прикрепить изображения (`type: image`) и одно
        вложение с кнопками (`type: inline_keyboard`). Общее количество
        вложений не должно превышать 12. Подробнее — [в
        примерах](https://dev.max.ru/docs-api#Примеры%20с%20видео,%20изображением,%20файлом)
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/UploadedInfo'
          required:
            - payload
    AudioAttachmentRequest:
      description: >-
        Запрос на прикрепление аудио к сообщению.


        Должен быть единственным вложением в сообщении
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/UploadedInfo'
          required:
            - payload
    UploadedInfo:
      description: >-
        Данные, которые вы получили в ответ на запрос загрузки медиафайла.
        Их можно передавать после того, как вы загрузили аудио, видео или файл
        и получили в ответ от сервера `retval`
      properties:
        token:
          description: >-
            Токен вложения — уникальный ID загруженного медиа: изображения,
            аудио, видео или файла. Возвращается в ответ на вызов [POST
            /uploads](https://dev.max.ru/docs-api/methods/POST/uploads)
          type: string
          minLength: 1
      required:
        - token
    FileAttachmentRequest:
      description: >-
        Данные для прикрепления файла к сообщению, которые вы получили в ответ
        на запрос загрузки.


        Файл можно отправить только в комбинации с вложением с кнопками —
        отправка совместно с изображением или видео не поддерживается. При этом
        к сообщению можно прикрепить только один файл и одно вложение
        с кнопками
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              description: >-
                Данные для прикрепления файла к сообщению, которые вы получили
                в ответ на запрос загрузки
              allOf:
                - $ref: '#/components/schemas/UploadedInfo'
          required:
            - payload
    UploadType:
      description: >-
        Тип загружаемого медиафайла


        Возможные значения и поддерживаемые форматы:

        - `image` — изображение (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC)

        - `video` — видеофайл (MP4, MOV, MKV, WEBM, MATROSKA)

        - `audio` — аудиофайл (MP3, WAV, M4A и другие)

        - `file` — файл, поддерживаются распространённые форматы
        (например, TXT, DOC и другие)


        При передаче неподдерживаемого типа файла вернётся ошибка `File
        extension is forbidden`


        Максимальный размер одного медиафайла, который можно загрузить,
        зависит от его типа:

        - 50 МБ или не более 7680 × 7680 px — для изображений (должны
        выполняться оба критерия)

        - 250 МБ — для видео

        - 256 МБ или длительностью не более 60 мин — для аудио (должны
        выполняться оба критерия)

        - 4 ГБ — для остальных файлов
      enum:
        - image
        - video
        - audio
        - file
    ContactAttachmentRequest:
      description: >-
        Запрос на прикрепление карточки контакта к сообщению.


        К сообщению можно прикрепить только один контакт. Совместно с ним можно
        прикрепить дополнительно одно вложение с кнопками
        (`type: inline_keyboard`). Передача других типов вложений совместно
        с контактом не поддерживается
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              description: >-
                Данные для прикрепления карточки контакта к сообщению
              allOf:
                - $ref: '#/components/schemas/ContactAttachmentRequestPayload'
          required:
            - payload
    ContactAttachmentRequestPayload:
      properties:
        contact_id:
          description: ID контакта, если он зарегистрирован в MAX
          type: integer
          format: int64
        vcf_info:
          description: Полная информация о контакте в формате VCF
          type: string
          minLength: 20
    StickerAttachmentRequest:
      description: >-
        Запрос на прикрепление стикера.


        Должен быть единственным вложением в сообщении
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/StickerAttachmentRequestPayload'
          required:
            - payload
    StickerAttachmentRequestPayload:
      properties:
        code:
          description: Код стикера
          type: string
          minLength: 1
      required:
        - code
    InlineKeyboardAttachmentRequest:
      description: Запрос на прикрепление клавиатуры к сообщению
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              description: >-
                Данные для прикрепления кнопок к сообщению.


                Ограничения:

                - Максимальное количество кнопок в ряду — 7

                - Максимальное количество строк с кнопками — 30

                - Если в ряду есть кнопки с типами `link`, `open_app`,
                `request_geo_location` или `request_contact`, то максимальное
                количество кнопок в ряду — 3
              type: object
              allOf:
                - $ref: '#/components/schemas/InlineKeyboardAttachmentRequestPayload'
          required:
            - payload
    InlineKeyboardAttachmentRequestPayload:
      properties:
        buttons:
          description: Двумерный массив кнопок
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/Button'
      required:
        - buttons
    LocationAttachmentRequest:
      description: Запрос на прикрепление геолокации к сообщению
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            latitude:
              type: number
              format: double
              description: Широта, до 15 символов
            longitude:
              type: number
              format: double
              description: Долгота, до 15 символов
          required:
            - latitude
            - longitude
    ShareAttachmentRequest:
      description: >-
        Запрос на прикрепление предпросмотра контента по внешнему URL
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              description: >-
                Данные для прикрепления предпросмотра контента по внешнему URL
              allOf:
                - $ref: '#/components/schemas/ShareAttachmentPayload'
          required:
            - payload
    MarkupElement:
      description: >-
        Тип элемента разметки.


        Может быть \*\*жирный\*\*, \*курсив\*, ~~зачёркнутый~~,
        ++подчёркнутый++, \`моноширинный\`, ^^выделенный^^, цитата,
        заголовок, ссылка или упоминание пользователя.


        В тексте комментариев не поддерживаются гиперссылки и упоминание
        пользователей
      properties:
        type:
          type: string
        from:
          description: >-
            Индекс начала элемента разметки в тексте. Нумерация с нуля
          type: integer
          format: int32
        length:
          description: Длина элемента разметки в символах
          type: integer
          format: int32
      discriminator:
        propertyName: type
        mapping:
          strong: '#/components/schemas/StrongMarkup'
          emphasized: '#/components/schemas/EmphasizedMarkup'
          monospaced: '#/components/schemas/MonospacedMarkup'
          link: '#/components/schemas/LinkMarkup'
          strikethrough: '#/components/schemas/StrikethroughMarkup'
          underline: '#/components/schemas/UnderlineMarkup'
          user_mention: '#/components/schemas/UserMentionMarkup'
          heading: '#/components/schemas/HeadingMarkup'
          highlighted: '#/components/schemas/HighlightedMarkup'
          quote: '#/components/schemas/QuoteMarkup'
      required:
        - type
        - from
        - length
    StrongMarkup:
      description: Представляет \*\*жирный\*\* текст
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    EmphasizedMarkup:
      description: Представляет \*курсив\*
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    MonospacedMarkup:
      description: >-
        Представляет \`моноширинный\` или блок \`\`\`код\`\`\` в тексте
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    LinkMarkup:
      description: >-
        Представляет ссылку в тексте.


        В тексте комментариев гиперссылки не поддерживаются
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
        - properties:
            url:
              description: URL ссылки
              type: string
              minLength: 1
              maxLength: 2048
          required:
            - url
    StrikethroughMarkup:
      description: Представляет \~зачёркнутый\~ текст
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    UnderlineMarkup:
      description: Представляет \<ins>подчёркнутый\</ins> текст
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    HeadingMarkup:
      description: Представляет заголовок
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    QuoteMarkup:
      description: Представляет цитату
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    UserMentionMarkup:
      description: >-
        Представляет упоминание пользователя в тексте. Упоминание может быть как
        по имени пользователя, так и по ID, если у пользователя нет имени.


        В тексте комментариев упоминание пользователей не поддерживается
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
        - properties:
            user_link:
              description: '`@username` упомянутого пользователя'
              type: string
            user_id:
              description: 'ID упомянутого пользователя без `@username`'
              type: integer
              format: int64
    HighlightedMarkup:
      description: Представляет выделенный текст
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    SubscriptionRequestBody:
      description: Запрос на настройку подписки WebHook
      properties:
        url:
          description: >-
            URL HTTPS-endpoint вашего бота. Должен начинаться с `https://`
          type: string
          minLength: 12
        update_types:
          description: Список типов событий, которые хочет получать ваш бот.
          example: '["message_created", "bot_started"]'
          type: array
          uniqueItems: true
          items:
            type: string
        secret:
          description: >-
            Cекрет, который должен быть отправлен в заголовке
            `X-Max-Bot-Api-Secret` в каждом запросе Webhook. Разрешены только
            символы `A-Z`, `a-z`, `0-9`, `_` и `-`. Заголовок рекомендован,
            чтобы запрос поступал из установленного веб-узла
          type: string
          minLength: 5
          maxLength: 256
          pattern: ^[a-zA-Z0-9_-]{5,256}$
        version:
          description: Версия API. Влияет на представление модели
          type: string
          minLength: 1
          pattern: '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
      required:
        - url
    GetSubscriptionsResult:
      description: Список всех WebHook подписок
      properties:
        subscriptions:
          description: Список текущих подписок
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
      required:
        - subscriptions
    SimpleQueryResult:
      description: Простой ответ на запрос
      properties:
        success:
          description: >-
            `true`, если запрос был успешным, `false` — в противном случае
          type: boolean
        message:
          description: Сообщение об ошибке
          type: string
      required:
        - success
    PinMessageBody:
      properties:
        message_id:
          description: >-
            ID сообщения, которое нужно закрепить. Соответствует полю
            `Message.body.mid`
          allOf:
            - $ref: '#/components/schemas/MessageId'
        notify:
          description: >-
            Если `true`, участники получат уведомление с системным сообщением о
            закреплении
          type: boolean
          default: true
      required:
        - message_id
    GetPinnedMessageResult:
      properties:
        message:
          description: >-
            Закреплённое сообщение. Может отсутствовать, если в чате нет
            закреплённого сообщения
          allOf:
            - $ref: '#/components/schemas/Message'
    Callback:
      description: Объект, отправленный боту, когда пользователь нажимает кнопку
      properties:
        timestamp:
          description: >-
            Unix timestamp в миллисекундах, когда пользователь нажал кнопку
          type: integer
          format: int64
        callback_id:
          description: Текущий ID клавиатуры
          type: string
          minLength: 1
        payload:
          description: Токен кнопки
          type: string
          minLength: 1
        user:
          description: Пользователь, нажавший на кнопку
          allOf:
            - $ref: '#/components/schemas/User'
      required:
        - timestamp
        - callback_id
        - payload
        - user
    CallbackAnswer:
      description: >-
        Отправьте этот объект, когда ваш бот хочет отреагировать на нажатие
        кнопки
      properties:
        message:
          description: Данные для обновления текущего сообщения
          allOf:
            - $ref: '#/components/schemas/NewMessageBody'
      required:
        - message
    Error:
      description: >-
        Сервер возвращает это, если возникло исключение при вашем запросе
      properties:
        error:
          description: Ошибка
          type: string
        code:
          description: Код ошибки
          type: string
          minLength: 1
        message:
          description: Читаемое описание ошибки
          type: string
      required:
        - code
        - message
    UploadEndpoint:
      description: Точка доступа, куда следует загружать ваши бинарные файлы
      type: object
      properties:
        url:
          description: >-
            URL для загрузки медиафайла. Срок жизни ссылки не ограничен
          type: string
          minLength: 1
        token:
          description: >-
            Токен для отправки медиафайла во вложении к сообщению с помощью
            `sendMessage()` или `editMessage()`
          type: string
          minLength: 1
      required:
        - url
    UserIdsList:
      description: >-
        Список ID пользователей для добавления в групповой чат
      properties:
        user_ids:
          description: >-
            Массив ID пользователей, которых вы хотите добавить в групповой чат.
            В одном запросе можно передать максимум 100 идентификаторов
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minItems: 1
            maxItems: 100
      required:
        - user_ids
    ActionRequestBody:
      properties:
        action:
          $ref: '#/components/schemas/SenderAction'
      required:
        - action
    SenderAction:
      description: |
        Действие, отправляемое участникам чата.

        Возможные значения:
        - `typing_on` — Бот набирает сообщение
        - `sending_photo` — Бот отправляет фото
        - `sending_video` — Бот отправляет видео
        - `sending_audio` — Бот отправляет аудиофайл
        - `sending_file` — Бот отправляет файл
        - `mark_seen` — Бот помечает сообщения как прочитанные
      enum:
        - typing_on
        - sending_photo
        - sending_video
        - sending_audio
        - sending_file
        - mark_seen
    UpdateList:
      description: >-
        Список событий в чатах и каналах, в которые добавлен бот.
        Обратите внимание, чтобы получать события из групповых чатов и каналов,
        бот должен быть администратором
      properties:
        updates:
          description: Страница событий
          type: array
          items:
            $ref: '#/components/schemas/Update'
        marker:
          description: Указатель на следующую страницу данных
          type: integer
          format: int64
      required:
        - updates
    Update:
      description: >-
        Объект `Update` представляет различные события в чате или канале.


        > Чтобы получать события из группового чата или канала, назначьте бота
        администратором и дайте права на чтение всех сообщений


        На свои действия бот события не получает
      discriminator:
        propertyName: update_type
        mapping:
          message_created: '#/components/schemas/MessageCreatedUpdate'
          message_callback: '#/components/schemas/MessageCallbackUpdate'
          message_edited: '#/components/schemas/MessageEditedUpdate'
          message_removed: '#/components/schemas/MessageRemovedUpdate'
          comment_created: '#/components/schemas/CommentCreatedUpdate'
          comment_edited: '#/components/schemas/CommentEditedUpdate'
          comment_removed: '#/components/schemas/CommentRemovedUpdate'
          bot_added: '#/components/schemas/BotAddedToChatUpdate'
          bot_removed: '#/components/schemas/BotRemovedFromChatUpdate'
          dialog_muted: '#/components/schemas/DialogMutedUpdate'
          dialog_unmuted: '#/components/schemas/DialogUnmutedUpdate'
          dialog_cleared: '#/components/schemas/DialogClearedUpdate'
          dialog_removed: '#/components/schemas/DialogRemovedUpdate'
          user_added: '#/components/schemas/UserAddedToChatUpdate'
          user_removed: '#/components/schemas/UserRemovedFromChatUpdate'
          bot_started: '#/components/schemas/BotStartedUpdate'
          bot_stopped: '#/components/schemas/BotStoppedUpdate'
          chat_title_changed: '#/components/schemas/ChatTitleChangedUpdate'
      properties:
        update_type:
          type: string
        timestamp:
          description: >-
            Unix timestamp в миллисекундах, когда произошло событие
          type: integer
          format: int64
      required:
        - update_type
        - timestamp
    MessageCallbackUpdate:
      description: >-
        Вы получите это событие как только пользователь нажмёт кнопку
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            callback:
              description: ''
              allOf:
                - $ref: '#/components/schemas/Callback'
            message:
              description: >-
                Изначальное сообщение, содержащее встроенную клавиатуру
              allOf:
                - $ref: '#/components/schemas/Message'
            user_locale:
              description: Текущий язык пользователя в формате IETF BCP 47
              type: string
              minLength: 1
          required:
            - callback
            - message
    MessageCreatedUpdate:
      description: >-
        Вы получите это событие, как только сообщение будет создано.


        Событие может относиться к объекту, который не поддерживается MAX API.
        В этом случае поле `message` не передаётся
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: >-
                Новое созданное сообщение. Отсутствует, если событие относится
                к объекту, который не поддерживается MAX API
              allOf:
                - $ref: '#/components/schemas/Message'
            user_locale:
              description: >-
                Текущий язык пользователя в формате IETF BCP 47. Доступно только
                в диалогах
              type: string
              minLength: 1
    MessageRemovedUpdate:
      description: Вы получите это событие, как только сообщение будет удалено
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message_id:
              description: ID удалённого сообщения
              allOf:
                - $ref: '#/components/schemas/MessageId'
            chat_id:
              description: ID чата, где сообщение было удалено
              type: integer
              format: int64
            user_id:
              description: Пользователь, удаливший сообщение
              type: integer
              format: int64
          required:
            - message_id
            - chat_id
            - user_id
    MessageEditedUpdate:
      description: >-
        Вы получите это событие, как только пользователь отредактирует
        сообщение.


        Событие может относиться к объекту, который не поддерживается MAX API.
        В этом случае поле `message` не передаётся
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: >-
                Отредактированное сообщение. Отсутствует, если событие относится
                к объекту, который не поддерживается MAX API
              allOf:
                - $ref: '#/components/schemas/Message'
    CommentCreatedUpdate:
      description: Вы получите это событие, как только комментарий будет создан
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: Новый созданный комментарий
              allOf:
                - $ref: '#/components/schemas/CommentMessage'
          required:
            - message
    CommentEditedUpdate:
      description: >-
        Вы получите это событие, как только пользователь или бот отредактирует
        комментарий в канале
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: Отредактированный комментарий
              allOf:
                - $ref: '#/components/schemas/CommentMessage'
          required:
            - message
    CommentRemovedUpdate:
      description: Вы получите это событие, как только комментарий будет удалён
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message_id:
              description: ID удалённого комментария
              allOf:
                - $ref: '#/components/schemas/MessageId'
            chat_id:
              description: ID чата, где комментарий был удалён
              type: integer
              format: int64
            user_id:
              description: Пользователь, удаливший комментарий
              type: integer
              format: int64
            post_id:
              description: Идентификатор поста в канале
              allOf:
                - $ref: '#/components/schemas/MessageId'
          required:
            - message_id
            - chat_id
            - user_id
            - post_id
    BotAddedToChatUpdate:
      description: >-
        Вы получите это событие, как только бот будет добавлен в чат или канал
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата или канала, куда был добавлен бот
              type: integer
              format: int64
            user:
              description: Пользователь, добавивший бота в чат
              allOf:
                - $ref: '#/components/schemas/User'
            is_channel:
              description: Указывает, что бот добавлен в канал, а не в чат
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    BotRemovedFromChatUpdate:
      description: >-
        Вы получите это событие, как только бот будет удалён из чата
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата, откуда был удалён бот
              type: integer
              format: int64
            user:
              description: Пользователь, удаливший бота из чата
              allOf:
                - $ref: '#/components/schemas/User'
            is_channel:
              description: Указывает, что бот удалён из канала, а не из чата
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    DialogMutedUpdate:
      description: >-
        Вы получите это событие, как только пользователь отключит уведомления о
        новых сообщениях в диалоге, чате или канале
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID диалога, чата или канала, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, который отключил уведомления
              allOf:
                - $ref: '#/components/schemas/User'
            muted_until:
              description: >-
                Время, до наступления которого уведомления в диалоге, чате или
                канале были отключены (Unix timestamp в миллисекундах)
              type: integer
              format: int64
            user_locale:
              description: Текущий язык пользователя в формате IETF BCP 47
              type: string
              minLength: 1
          required:
            - chat_id
            - user
            - muted_until
    DialogUnmutedUpdate:
      description: >-
        Вы получите это событие, как только пользователь включит уведомления о
        новых сообщениях в диалоге, чате или канале
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID диалога, чата или канала, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, который включил уведомления
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Текущий язык пользователя в формате IETF BCP 47
              type: string
              minLength: 1
          required:
            - chat_id
            - user
    DialogClearedUpdate:
      description: >-
        Вы получите это событие, как только пользователь очистит историю
        сообщений
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, который очистил историю сообщений
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Текущий язык пользователя в формате IETF BCP 47
              type: string
              minLength: 1
          required:
            - chat_id
            - user
    DialogRemovedUpdate:
      description: Вы получите это событие, как только пользователь удалит чат
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, который удалил чат
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Текущий язык пользователя в формате IETF BCP 47
              type: string
              minLength: 1
          required:
            - chat_id
            - user
    UserAddedToChatUpdate:
      description: >-
        Вы получите это событие, как только пользователь будет добавлен в чат,
        где бот является администратором
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, добавленный в чат
              allOf:
                - $ref: '#/components/schemas/User'
            inviter_id:
              description: >-
                Пользователь, который добавил нового пользователя в чат. Может
                отсутствовать, если пользователь присоединился к чату по ссылке
              type: integer
              format: int64
            is_channel:
              description: >-
                Указывает, что пользователь добавлен в канал, а не в чат
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    UserRemovedFromChatUpdate:
      description: >-
        Вы получите это событие, как только пользователь будет удалён из чата,
        где бот является администратором
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, удалённый из чата
              allOf:
                - $ref: '#/components/schemas/User'
            admin_id:
              description: >-
                Администратор, который удалил пользователя из чата. Может
                отсутствовать, если пользователь покинул чат сам
              type: integer
              format: int64
            is_channel:
              description: >-
                Указывает, что пользователь удалён из канала, а не из чата
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    BotStartedUpdate:
      description: >-
        Вы получите это событие, как только пользователь начнёт или возобновит
        общение с ботом (нажмёт кнопку "Начать")
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID диалога, где произошло событие
              type: integer
              format: int64
            user:
              description: >-
                Пользователь, который запустил бота через интерфейс, например
                нажав кнопку «Начать»
              allOf:
                - $ref: '#/components/schemas/User'
            payload:
              description: >-
                Дополнительные данные из диплинков, переданные при запуске бота.
                Подробнее о диплинках — в
                [разделе FAQ](https://dev.max.ru/help/deeplinks)
              type: string
              minLength: 1
              maxLength: 128
            user_locale:
              description: >-
                Текущий язык пользователя в формате
                [IETF BCP 47](https://www.rfc-editor.org/info/bcp47/)
              type: string
              minLength: 1
          required:
            - chat_id
            - user
            - user_id
    BotStoppedUpdate:
      description: >-
        Вы получите это событие, как только пользователь остановит бота в его
        настройках в МАКС
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID диалога, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, который остановил бота
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Текущий язык пользователя в формате IETF BCP 47
              type: string
              minLength: 1
          required:
            - chat_id
            - user
    ChatTitleChangedUpdate:
      description: >-
        Вы получите это событие, как только будет изменено название чата
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: ID чата, где произошло событие
              type: integer
              format: int64
            user:
              description: Пользователь, который изменил название
              allOf:
                - $ref: '#/components/schemas/User'
            title:
              description: Новое название
              type: string
              minLength: 1
          required:
            - chat_id
            - user
            - title
    MessageChatCreatedUpdate:
      description: >-
        Вы получите это событие, как только пользователь нажмёт в сообщении на
        кнопку с типом `chat` и будет создан новый чат с ботом, связанный с этим
        сообщением с кнопкой
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat:
              description: Созданный чат
              allOf:
                - $ref: '#/components/schemas/Chat'
            message_id:
              description: ID сообщения, где была нажата кнопка
              allOf:
                - $ref: '#/components/schemas/MessageId'
            start_payload:
              description: Полезная нагрузка от кнопки чата
              type: string
          required:
            - message_id
            - chat
    ModifyMembersResult:
      description: Результат запроса на изменение списка участников
      allOf:
        - $ref: '#/components/schemas/SimpleQueryResult'
        - properties:
            failed_user_ids:
              description: >-
                ID пользователей, которых не удалось добавить в групповой чат
              type: array
              items:
                type: integer
                format: int64
            failed_user_details:
              description: >-
                Подробное объяснение, почему пользователь не был добавлен в
                групповой чат
              type: array
              items:
                $ref: '#/components/schemas/FailedUserDetails'
    FailedUserDetails:
      description: >-
        Подробное объяснение, почему пользователь не был добавлен в
        групповой чат
      properties:
        error_code:
          description: Код ошибки
          type: string
        user_ids:
          description: ID пользователей с данной ошибкой
          type: array
          items:
            type: integer
            format: int64
      required:
        - error_code
        - user_ids
